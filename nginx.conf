user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    client_max_body_size 0;
    #tcp_nopush     on;

    large_client_header_buffers 4 32k;    

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    # Traefik terminates TLS in front of this container, so the client IP arrives in X-Forwarded-For. Trust it only
    # from the Docker network (Traefik strips forged X-Forwarded-For from outside); narrow to the dlr-internal subnet.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-IP brake on the unauthenticated auth endpoints: password brute force, signup spam, guest-account floods.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # Model preview needs no login and runs the generator; the editor calls it on every change, so a looser zone.
    limit_req_zone $binary_remote_addr zone=preview:10m rate=120r/m;
    limit_req_status 429;

	upstream websocket{
        server 127.0.0.1:58550; 
        #SERVER endpoint that handle ws:// connections
    }
    
	server {
		listen 80;
		server_name  localhost;

		location / {
			root   /usr/share/nginx/html;
			index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
        location ~ ^/api/(auth/(login|signup|guest)|oauth/oidc/callback)$ {
            limit_req zone=auth burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;  # regex locations can't strip the prefix via proxy_pass
            proxy_pass http://perihub_backend:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location ~ ^/api/models/[^/]+/preview$ {
            limit_req zone=preview burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://perihub_backend:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /api/ {
            proxy_pass http://perihub_backend:8000/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /ws {
                proxy_pass http://perihub_backend:8000/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
        }
		error_page   500 502 503 504  /50x.html;
		location = /50x.html {
			root   /usr/share/nginx/html;
		}
		
		#server_name perihub.dlr.de;
		
		# ssl_certificate /app/certs/jenkinsCert.pem;
        # ssl_certificate_key /app/certs/jenkinsKey.pem;
    }
}