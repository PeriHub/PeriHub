[alembic]
script_location = alembic

# version file naming
file_template = %%(rev)s_%%(slug)s

# timezone for revision timestamps (optional, uncomment to use)
# timezone = UTC

# path additions so `app.db.*` / `app.support.*` resolve - handled
# explicitly in env.py by locating the `app` package as a sibling of this
# ini's directory, so this is left at the alembic default and not relied
# upon.
prepend_sys_path = .

# fallback URL - env.py overwrites this with DATABASE_URL from the
# environment/.env (see app/support/globals.py) if it's set, so this value
# only matters if DATABASE_URL is unset. Points at the docker-compose
# perihub_db service defaults for local convenience.
sqlalchemy.url = postgresql+psycopg://perihub:perihub@localhost:5432/perihub

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
