name: CI
on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "static/**"
      - "backend/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/CI.yml"
  pull_request:
    branches: [main]
    paths: *paths
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r ../requirements.txt -r ../requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit
        env:
          PYTHONPATH: ${{ github.workspace }}
          SESSION_SECRET: ci-test-secret-not-for-production

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit

  e2e:
    needs: [backend-tests, frontend-checks]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t perihub/backend:dev ./backend
      - name: Run Docker container
        run: docker run -d -p 8000:8000 -v ./test:/app/simulations perihub/backend:dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: ./playwright-report/
          retention-days: 30

  publish:
    needs: e2e
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker images
        run: |
          docker build -t perihub/backend:dev ./backend
          docker build -t perihub/frontend:dev .
      - name: Publish to Registry
        run: |
          docker push perihub/backend:dev
          docker push perihub/frontend:dev
