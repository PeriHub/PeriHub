name: CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image
        run: docker build -t perihub/backend:dev ./backend
      - name: Run Docker container
        run: docker run -d -p 8000:8000 -v ./test:/app/simulations perihub/backend:dev
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: ./playwright-report/
          retention-days: 30
      - name: Build Docker image
        if: github.ref_name == 'main'
        run: docker build -t perihub/frontend:dev .
      - name: Publish to Registry
        if: github.ref_name == 'main'
        run: docker push perihub/backend:dev
      - name: Publish to Registry
        if: github.ref_name == 'main'
        run: docker push perihub/frontend:dev
