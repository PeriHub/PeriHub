services:
  perihub_db:
    image: postgres:16-alpine
    container_name: perihub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER-perihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-perihub}
      POSTGRES_DB: ${POSTGRES_DB-perihub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${DB_VOLUME-perihub_db_data}:/var/lib/postgresql/data
    ports:
      - 5432:5432

  perihub_backend:
    # image: perihub/backend
    build:
      context: ./backend
    container_name: perihub_backend
    env_file:
      - .env
    depends_on:
      perihub_db:
        condition: service_healthy
    volumes:
      - ${VOLUME-./backend/app/simulations}:/app/simulations
      - ${OWN_MODELS-./backend/app/own_models}:/app/own_models
    ports:
      - 8000:8000

  perihub_frontend:
    # image: perihub/frontend
    build:
      context: .
    container_name: perihub_frontend
    env_file:
      - .env
    depends_on:
      - perihub_backend
    ports:
      - 8080:80

  perilab:
    image: perihub/perilab:nightly
    container_name: perihub_perilab
    # No published port needed any more - perihub_backend reaches this
    # container via `docker exec` over the Docker socket (see above),
    # not SSH, so port 22 doesn't need to be exposed at all.
    volumes:
      - ${VOLUME-./backend/app/simulations}:/app/simulations
    ports:
      - 3001:8000

volumes:
  perihub_db_data:
