services:
  perihub_backend:
    # image: perihub/backend
    build:
      context: ./backend
    container_name: perihub_backend
    env_file:
      - .env
    volumes:
      - ${VOLUME-./backend/app/simulations}:/app/simulations
      - ${RSA_VOLUME-./backend/app/rsaFiles}:/app/rsaFiles
      - ${OWN_MODELS-./backend/app/own_models}:/app/own_models
      # Lets this container run commands directly inside perihub_perilab
      # (docker exec, via the Docker SDK - see
      # support/file_handler.py:get_perilab_container()) instead of
      # needing an SSH server baked into the solver image.
      - /var/run/docker.sock:/var/run/docker.sock

  perihub_frontend:
    # image: perihub/frontend
    build:
      context: .
    container_name: perihub_frontend
    env_file:
      - .env
    depends_on:
      - perihub_backend
    ports:
      - 8080:80

  perilab:
    image: perihub/perilab
    container_name: perihub_perilab
    # No published port needed any more - perihub_backend reaches this
    # container via `docker exec` over the Docker socket (see above),
    # not SSH, so port 22 doesn't need to be exposed at all.
    volumes:
      - ${VOLUME-./backend/app/simulations}:/app/simulations
